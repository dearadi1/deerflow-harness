  #   timeout: 10
  #   # 页面加载后的等待时间（秒）。设为正数可启用，设为 -1 可关闭。
  #   fetch_time: 10
  #   # 导航到页面的超时时间（秒）。设为正数可启用，设为 -1 可关闭。
  #   navigation_timeout: 30

  # 网页抓取工具（使用 Firecrawl。云服务需要 FIRECRAWL_API_KEY；自托管服务可能无需密钥。）
  # - name: web_fetch
  #   group: web
  #   use: deerflow.community.firecrawl.tools:web_fetch_tool
  #   # api_key: $FIRECRAWL_API_KEY
  #   # base_url: http://<host>:3002  # 可选：自托管 Firecrawl；无需云服务 API 密钥
  #   # allow_private_addresses: false      # SSRF 防护：生产环境保持 false。仅在有意访问内部目标时设为 true。
  #   # network_isolation_confirmed: false  # SSRF 防护：Firecrawl 服务器会自行解析 URL、跟随重定向，
  #   #                                     # 并加载子资源，因此上方的目标 URL 防护无法端到端执行。
  #   #                                     # 仅当其出站网络与私有网络和云元数据网络隔离时设为 true。

  # 网页抓取工具（使用 GroundRoute，需要 GROUNDROUTE_API_KEY）
