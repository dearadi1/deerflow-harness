# DeerFlow 应用配置
#
# 使用说明：
# - 复制此文件为 `config.yaml`，并根据你的环境进行自定义。
# - 默认情况下，配置文件路径为项目根目录下的 `config.yaml`。
#   可通过 `DEER_FLOW_PROJECT_ROOT` 显式指定该根目录，或使用
#   `DEER_FLOW_CONFIG_PATH` 指向特定配置文件。
# - 运行时状态默认保存在项目根目录下的 `.deer-flow`。如需使用其他可写数据目录，
#   可通过 `DEER_FLOW_HOME` 覆盖。
# - 将 `DEER_FLOW_DATE_TIMEZONE` 设置为 IANA 时区名称（例如 `Asia/Shanghai`），
#   使注入 Agent 的对话日期遵循指定时区，而非服务器本地时区。该变量由日期上下文
#   中间件在运行时读取（不是配置架构字段），因此容器无需挂载 `config.yaml` 也可设置。
# - 所有字段值都支持使用环境变量。例如：`api_key: $OPENAI_API_KEY`
# - `use` 路径是如下形式的字符串："package_name.sub_package_name.module_name:class_name/variable_name"。

# ============================================================================
# 配置版本（用于检测过期的配置文件）
# ============================================================================
# 配置架构发生变化时，请递增此版本号。
# 运行 `make config-upgrade`，将新增字段合并到本地 `config.yaml`。
config_version: 62

# 可选：由运维人员维护的提示词文本扩展（参见 CONFIGURATION.md）：
# lead_prompt_overlay:
#   prepend: "遵循组织级写作规范。"
#   append: "在报告末尾附上简明的决策摘要。"
# 子 Agent：subagents.agents.<name>.prompt_overlay.{prepend,append}
# DeerMem：memory.backend_config.{prompt_prepend,prompt_append}

# 可选：按模型设置请求速率控制（位于 models[] 条目内）：
# request_admission:
#   requests_per_minute: 60
#   group: shared-provider-account  # 可选；默认使用模型配置名称
#   max_wait_seconds: 300
#   max_queue_size: 256
# 默认关闭，配置后才启用。共享组中的设置必须一致；修改后需重启。
# 仅限制单进程的 RPM，不限制 TPM，也不是集群级配额。参见
# backend/docs/CONFIGURATION.md 中的“模型请求准入”一节。

# ============================================================================
# 日志
# ============================================================================
# deerflow 模块的日志级别（debug/info/warning/error）
log_level: info

# 始终会生成 Trace ID，并通过响应头 `X-Trace-Id` 返回；此配置块仅控制日志输出，
# 即日志记录是否包含 `trace_id` 字段以及字段格式。默认关闭，因为启用后会改变日志格式。
# 需要重启才能生效（参见 reload_boundary.py）。
logging:
  enhance:
    enabled: false
    format: text

# ============================================================================
# Agent 扩展
# ============================================================================
# 可选的 AgentMiddleware 类，会加载到主 Agent 和子 Agent 的运行时中间件链中，
# 位置在内置运行时中间件之后、安全/澄清收尾中间件之前。缺少依赖包、类无效或模块异常，
# 会在创建 Agent 时产生可操作的导入错误；构造函数异常则会在创建 Agent 时原样抛出。
# 主 Agent 和子 Agent 运行时共用同一列表；目前无法分别配置仅用于主 Agent 或仅用于子 Agent 的中间件。
# 每项可以是类路径，也可以是用于传递构造参数的 `{class, kwargs}`。kwargs 值必须是
# JSON 类型（对象、数组、字符串、数字、布尔值或 null）；YAML 日期和时间戳会转换为 ISO 字符串，
# 以匹配 JSON 类型。由于中间件类会执行代码，请将这些文件视为可信的运维配置。
# 取消注释此块即可在 config.yaml 中定义中间件。保持注释状态时，extensions_config.json
# 仍是此固定槽位（非弃用）中间件列表的权威来源。打包插件使用下方的 `plugins:` 配置块。
# extensions:
#   middlewares:
#     - my_company.deerflow_middlewares:DomainGuardMiddleware
#     - class: my_company.deerflow_middlewares:LatencyStampingMiddleware
#       kwargs:
#         header: X-DeerFlow-Latency

# ============================================================================
# 链路追踪 / 可观测性（Monocle）
# ============================================================================
# 可选：通过 Monocle 对 Agent 进行链路追踪。通过环境变量配置
# （MONOCLE_TRACING、MONOCLE_EXPORTERS、OKAHU_API_KEY，类似 LangSmith/Langfuse），
# 而非 config.yaml 配置项，且默认关闭。设置方法、各导出器采集的内容及追踪数据的去向，
# 请参见 README.md → “Monocle Tracing”。

# ============================================================================
# Token 用量
# ============================================================================
# 启用 Token 用量的采集和展示。
# 启用后，DeerFlow 会记录每次模型调用的输入/输出/总 Token 数；当服务提供方返回用量信息时，
# 工作区界面也会显示相应的元数据。
token_usage:
  enabled: true

# ============================================================================
# Token 预算 — 单次运行的 Token 限额
# ============================================================================
# 通过为每次运行设置严格的 Token 限额，避免 API 费用失控。
# 超过 warn_threshold 时，Agent 会收到上下文内警告。
# 超过 hard_stop_threshold 时，系统会移除 tool_calls，强制 Agent 立即给出最终答复。
token_budget:
  enabled: false                # 设为 true 以启用预算限制
  max_tokens: 200000            # 每次运行的 Token 总限额（输入 + 输出）
  max_input_tokens: null        # 可选的独立输入 Token 限额
  max_output_tokens: null       # 可选的独立输出 Token 限额
  warn_threshold: 0.8           # 达到预算的 80% 时发出警告
  hard_stop_threshold: 1.0      # 达到预算的 100% 时强制停止

# ============================================================================
# 递归限制
# ============================================================================
# 单次运行的 recursion_limit 限制 LangGraph 超步数（每个超步至少包含一次 LLM 调用）。
# 客户端可在每个请求中覆盖默认值；无效或非正数的客户端值会回退到此处配置的默认值。
recursion_limit: 100

# Gateway 不会接受超过此上限的配置值或客户端传入值，以防 API 费用失控或遭受 DoS。
# 只有确实需要运行深度嵌套的子 Agent 图时才应提高此值。
max_recursion_limit: 1000


# ============================================================================
# 模型配置
# ============================================================================
# 配置 Agent 可使用的 LLM 模型。
#
# 两个 Token 字段看起来相似，但含义不同：
# - `max_tokens` 是传给服务提供方的单次调用输出上限。
# - `context_window` 是表示上下文总容量（prompt + completion）的正整数。它用于驱动
#   聊天界面中的实时“上下文使用率”指示器，并提供给模型的 LangChain 配置文件；基于比例的
#   摘要触发器（`summarization.trigger: [{type: fraction, ...}]`）会据此计算触发阈值。
#   第三方 OpenAI 兼容模型没有内置配置文件，因此未设置 `context_window` 时，比例触发器会降级
#   （发出警告并被忽略），而不会导致 Agent 构建失败。
# 如果服务提供方的上下文限制未知，请不要设置 `context_window`；此时不会显示使用率。
# 请根据服务提供方的模型文档核实配置值。
#
# 可选：按模型配置价格（用于工作区控制台显示实际费用）。可在任一模型条目中添加 `pricing` 配置块；
# 所有模型必须使用同一种货币。为避免错误求和，混用货币时将关闭费用统计。
# 价格按每百万 Token 计。
#
#   pricing:
#     currency: CNY                    # 控制台显示的 ISO 货币代码（CNY、USD 等）
#     input_per_million: 8.0           # 每百万输入 Token 的价格（未命中缓存）
#     output_per_million: 32.0         # 每百万输出 Token 的价格
#     input_cache_hit_per_million: 0.8 # 每百万命中缓存的输入 Token 价格
#                                      # （可选；省略时按未命中缓存的价格计费）

# 客户端流使用独立的 price 配置块（人民币，元/百万 Token）：
#   price:
#     price_input_normal: 12.0
#     price_output_normal: 36.0
#     price_input_cache_hit: 1.5
# 缓存命中数量包含在 input_tokens 内，计费时先扣除，避免重复计费。
# 缺少单价或必要的缓存用量时，流事件将标记为无法计价。

models:
  # 示例：火山引擎（豆包）模型
  # - name: doubao-seed-1.8
  #   display_name: Doubao-Seed-1.8
  #   use: deerflow.models.patched_deepseek:PatchedChatDeepSeek
  #   model: doubao-seed-1-8-251228
  #   api_base: https://ark.cn-beijing.volces.com/api/v3
  #   api_key: $VOLCENGINE_API_KEY
  #   timeout: 600.0
  #   max_retries: 2
  #   context_window: 262144     # prompt + completion 的总容量
  #   supports_thinking: true
  #   supports_vision: true
  #   supports_reasoning_effort: true
  #   when_thinking_enabled:
  #     extra_body:
  #       thinking:
  #         type: enabled
  #   when_thinking_disabled:
  #     extra_body:
  #       thinking:
  #         type: disabled

  # 示例：火山引擎 Coding Plan（一个密钥，多厂商网关）
  # 通过 Coding Plan 端点（/api/coding/v3），使用一个 API 密钥即可访问
  # 豆包、GLM、DeepSeek、Kimi 和 MiniMax 的模型。
  # 各模型对思考/视觉能力的支持可能不同，请分别配置。
  #
  # - name: glm-5.2-cp
  #   display_name: GLM-5.2 (Coding Plan)
  #   use: deerflow.models.patched_deepseek:PatchedChatDeepSeek
  #   model: glm-5.2
  #   api_base: https://ark.cn-beijing.volces.com/api/coding/v3
  #   api_key: $VOLCENGINE_API_KEY
  #   timeout: 600.0
  #   max_retries: 2
  #   supports_thinking: true
  #   supports_vision: false
  #   supports_reasoning_effort: true
  #   when_thinking_enabled:
  #     extra_body:
  #       thinking:
  #         type: enabled
  #   when_thinking_disabled:
  #     extra_body:
  #       thinking:
  #         type: disabled
  #
  # - name: deepseek-v4-pro-cp
  #   display_name: DeepSeek-V4-Pro (Coding Plan)
  #   use: deerflow.models.patched_deepseek:PatchedChatDeepSeek
  #   model: deepseek-v4-pro
  #   api_base: https://ark.cn-beijing.volces.com/api/coding/v3
  #   api_key: $VOLCENGINE_API_KEY
  #   timeout: 600.0
  #   max_retries: 2
  #   supports_thinking: true
  #   supports_vision: false
  #   supports_reasoning_effort: true
  #   when_thinking_enabled:
  #     extra_body:
  #       thinking:
  #         type: enabled
  #   when_thinking_disabled:
  #     extra_body:
  #       thinking:
  #         type: disabled

  # 推理能力契约（可选，按模型配置）
  #
  # 通过映射类型的 `reasoning:` 配置块启用此契约。现有 Ollama `reasoning: true` / `false` 布尔值，
  # 以及 gpt-oss 风格模型使用的 `low` / `medium` / `high` 等级字符串，仍属于服务提供方原生选项，
  # 并会继续传递给 ChatOllama。
  #
  # `supports_thinking` / `supports_reasoning_effort` 仅表示模型是否提供相应选项。
  # 对于服务提供方契约与 DeerFlow 通用假设不同的模型，可以改为声明 `reasoning:` 配置块；
  # 两个布尔值会由该配置推导，所有模型创建路径（聊天、总结、标题生成、子 Agent）都会执行相同的规范化策略：
  #
  #   reasoning:
  #     thinking: optional             # unsupported | optional | required
  #     on_disable_request: keep_enabled   # 仅 required 适用：keep_enabled | reject
  #     dialect: auto                  # auto | openai_extra_body | anthropic |
  #                                    # vllm_chat_template | ollama | none
  #     history: clear                 # preserve | clear（省略时使用服务提供方默认值）
  #     effort:
  #       values: [low, medium, high]  # 服务提供方的词汇表，按显示顺序排列
  #       default: medium              # 调用方未选择时使用
  #       aliases: {minimal: low}      # DeerFlow 通用值 -> 服务提供方的值
  #       path: reasoning_effort       # 点分标识符路径（默认值）
  #
  # `required` 思考模式永远不会收到关闭负载；未知的 effort 值不会传给服务提供方（会通过 `aliases` 映射或回退到
  # `default`）；缺少 `when_thinking_enabled` / `when_thinking_disabled` 时，`dialect` 可让工厂合成开关负载
  #（`auto` 会根据 `when_thinking_enabled` 推断）。`default` 也适用于从未选择 effort 的调用方——总结、标题生成和子 Agent——
  # 因此请选择一个你愿意在每次后台调用中付费使用的等级。以下矛盾配置会导致启动失败：`required` 与
  # `when_thinking_disabled` 同时出现、`default` 不在 `values` 中、契约拒绝的 effort 值出现在配置文件或
  # `when_thinking_*` 模板中、自定义 `effort.path` 旁残留 `reasoning_effort`，或 `path` 会覆盖 `extra_body` 等整个映射。
  # 未配置 `reasoning:` 的模型保持原有行为。

  # 示例：Z.AI GLM-5.3-Flash（必须思考，effort 选项受限）
  #
  # GLM-5.3-Flash 无法关闭思考，且只接受 low/high/max effort。
  # 此契约会让所有前台和后台调用都保持思考开启，将 DeerFlow 通用的 minimal/medium 预设映射到 low/high，
  # 并序列化 clear_thinking=true，使模型在总结后无需精确重放推理内容。
  # `default: high` 可避免后台调用耗尽服务提供方的最高推理预算；用户仍可在界面中选择 `max`。
  #
  # - name: glm-5.3-flash
  #   display_name: GLM-5.3-Flash
  #   use: deerflow.models.patched_deepseek:PatchedChatDeepSeek
  #   model: glm-5.3-flash
  #   api_base: https://api.z.ai/api/paas/v4
  #   api_key: $ZAI_API_KEY
  #   timeout: 600.0
  #   max_retries: 2
  #   temperature: 1.0
  #   top_p: 0.95
  #   max_tokens: 131072
  #   context_window: 1000000
  #   supports_vision: true
  #   stream_usage: false
  #   reasoning:
  #     thinking: required
  #     dialect: openai_extra_body
  #     history: clear
  #     effort:
  #       values: [low, high, max]
  #       default: high
  #       aliases:
  #         minimal: low
  #         medium: high
  #   extra_body:
  #     tool_stream: true

  # 示例：OpenAI 模型
  # - name: gpt-4
  #   display_name: GPT-4
  #   use: langchain_openai:ChatOpenAI
  #   model: gpt-4
  #   api_key: $OPENAI_API_KEY # 使用环境变量
  #   request_timeout: 600.0
  #   max_retries: 2
  #   max_tokens: 4096          # 单次调用的输出上限
  #   context_window: 128000    # 提示词与补全内容的总容量
  #   temperature: 0.7
  #   supports_vision: true # 为 view_image 工具启用视觉支持

  # 示例：OpenAI Responses API 模型
  # - name: gpt-5-responses
  #   display_name: GPT-5 (Responses API)
  #   use: langchain_openai:ChatOpenAI
  #   model: gpt-5
  #   api_key: $OPENAI_API_KEY
  #   request_timeout: 600.0
  #   max_retries: 2
  #   use_responses_api: true
  #   output_version: responses/v1
  #   # 可选，原样传递给 ChatOpenAI（默认 false）：仅发送新一轮内容和 previous_response_id，而不重放完整历史。
  #   # 链式上下文仍按输入 Token 计费；任何客户端侧历史重写（例如省略被阻止的写入负载）
  #   # 只有在重放历史时才会生效。
  #   use_previous_response_id: false
  #   context_window: 400000
  #   supports_vision: true

  # 示例：Ollama（原生服务提供方，可保留思考/推理内容）
  #
  # 重要：Ollama 模型请使用 langchain_ollama:ChatOllama，而不是 langchain_openai:ChatOpenAI。
  # OpenAI 兼容端点（/v1/chat/completions）不会以独立字段返回 reasoning_content——思考内容可能被合并到
  # <think> 标签中，或被完全丢弃（ollama/ollama#15293）。Ollama 原生 API（/api/chat）会正确区分思考内容和回复内容。
  #
  # 安装：cd backend && uv pip install 'deerflow-harness[ollama]'
  #
  # - name: qwen3-local
  #   display_name: Qwen3 32B (Ollama)
  #   use: langchain_ollama:ChatOllama
  #   model: qwen3:32b
  #   base_url: http://localhost:11434   # 不加 /v1 后缀，使用原生 /api/chat
  #   num_predict: 8192
  #   temperature: 0.7
  #   reasoning: true                    # 向 Ollama 原生 API 传递 think:true
  #   context_window: 32768              # 与 Ollama 服务提供的上下文长度一致
  #   supports_thinking: true
  #   supports_vision: false
  #
  # - name: gemma4-local
  #   display_name: Gemma 4 27B (Ollama)
  #   use: langchain_ollama:ChatOllama
  #   model: gemma4:27b
  #   base_url: http://localhost:11434
  #   num_predict: 8192
  #   temperature: 0.7
  #   reasoning: true
  #   context_window: 32768
  #   supports_thinking: true
  #   supports_vision: true
  #
  # Docker 部署时，请使用 host.docker.internal，而不是 localhost：
  #   base_url: http://host.docker.internal:11434

  # 示例：llama.cpp（兼容 OpenAI 的本地服务器）
  #
  # llama-server 暴露兼容 OpenAI 的 /v1/chat/completions 端点，因此请使用 ChatOpenAI，并将 base_url 指向服务器的 /v1 根路径。
  # --alias 可为所提供的模型指定稳定的 API 名称，不依赖 GGUF 文件名。
  #
  # 启动 llama.cpp，例如：
  #   llama-server -m /path/to/model.gguf --host 0.0.0.0 --port 8080 --alias qwen-local
  #
  # 工具调用取决于模型的聊天模板是否支持工具。目前 llama.cpp 默认启用 Jinja 模板引擎；
  # 如果覆盖模板，请使用支持函数/工具调用的模板。
  #
  # - name: qwen-llamacpp
  #   display_name: Qwen (llama.cpp)
  #   use: langchain_openai:ChatOpenAI
  #   model: qwen-local
  #   api_key: no-key              # llama-server 未启用身份验证时使用的非空占位值
  #   base_url: http://localhost:8080/v1
  #   request_timeout: 600.0
  #   max_retries: 2
  #   supports_vision: false
  #
  # 如果 llama-server 使用 --api-key 启动，请将占位值替换为该密钥（建议使用环境变量）。
  # 在 Docker 中，localhost 指 DeerFlow 容器本身；请改用容器可访问的地址，例如 Docker Desktop 上的：
  #   base_url: http://host.docker.internal:8080/v1

  # 示例：Anthropic Claude 模型（支持扩展思考）
  # 必须设置 supports_thinking: true；否则即使界面思考开关已开启，DeerFlow 也会静默回退到非思考模式。
  # thinking.type=enabled 时，Anthropic API 要求提供 budget_tokens
  #（服务器无默认值；最小值为 1024；必须小于 max_tokens）。
  # - name: claude-sonnet-4
  #   display_name: Claude Sonnet 4
  #   use: langchain_anthropic:ChatAnthropic
  #   model: claude-sonnet-4-20250514
  #   api_key: $ANTHROPIC_API_KEY
  #   default_request_timeout: 600.0
  #   max_retries: 2
  #   max_tokens: 16000         # 单次调用的输出上限
  #   context_window: 200000    # 提示词与补全内容的总容量
  #   supports_vision: true
  #   supports_thinking: true
  #   when_thinking_enabled:
  #     thinking:
  #       type: enabled
  #       budget_tokens: 4096   # 必填；最小值为 1024；必须小于 max_tokens
  #   when_thinking_disabled:
  #     thinking:
  #       type: disabled

  # 示例：Google Gemini 模型（原生 SDK，不支持思考）
  # - name: gemini-2.5-pro
  #   display_name: Gemini 2.5 Pro
  #   use: langchain_google_genai:ChatGoogleGenerativeAI
  #   model: gemini-2.5-pro
  #   gemini_api_key: $GEMINI_API_KEY
  #   timeout: 600.0
  #   max_retries: 2
  #   max_tokens: 8192
  #   context_window: 1048576
  #   supports_vision: true

  # 示例：通过 Google 官方 OpenAI 兼容端点调用 Gemini 模型
