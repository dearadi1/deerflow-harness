# ============================================================================
# 护栏配置
# ============================================================================
# 可选：在工具调用执行前进行授权。
# 启用后，每次工具调用都会先通过配置的服务提供方检查，再执行。共有四种选项：内置允许列表、
# OAP 策略服务提供方、自定义服务提供方或 TypeSafe（Jev）风险门控。完整文档参见
# backend/docs/GUARDRAILS.md。
#
# 服务提供方通过 resolve_variable 按类路径加载（与 models/tools 相同）。

# --- 选项 1：内置 AllowlistProvider（无需外部依赖） ---
# guardrails:
#   enabled: true
#   provider:
#     use: deerflow.guardrails.builtin:AllowlistProvider
#     config:
#       denied_tools: ["bash", "write_file"]

# --- 选项 2：OAP passport 服务提供方（开放标准，兼容任意实现） ---
#   Open Agent Passport（OAP）规范定义 passport 格式和决策代码。
#   任何兼容 OAP 的服务提供方都可使用。以下示例使用参考实现 APort：
#     pip install aport-agent-guardrails && aport setup --framework deerflow
# guardrails:
#   enabled: true
#   provider:
#     use: aport_guardrails.providers.generic:OAPGuardrailProvider

# --- 选项 3：自定义服务提供方（任何具有 evaluate/aevaluate 方法的类） ---
# guardrails:
#   enabled: true
#   provider:
#     use: my_package:MyGuardrailProvider
#     config:
#       key: value

# --- 选项 4：TypeSafe（Jev）执行前风险门控（网络服务提供方） ---
#   将工具名称及其完整参数 JSON 发送到 POST /v1/systemone，并拒绝风险概率达到 `threshold` 的调用。
#   需要 API 密钥：export TYPESAFE_API_KEY=...（或在下方设置 `api_key`）。
#
#   `tools: ["bash"]` 仅适合冒烟测试，不建议用于生产：操作可能转移到未经测试的工具、MCP 工具或子 Agent，
#   且长 heredoc/较大的 write_file 负载会在参数文本超过 max_state_chars 时被本地拒绝。
#   应测试所有可能执行高风险操作的工具，而不是缩小门控范围。将 `guardrails.provider` 指向 TypeSafe
#   会取代 allowlist/OAP 服务提供方：旧允许列表中的允许规则移到下方的 `allowed_tools`，拒绝规则仍应配置在
#   `authorization.*` 下（参见 backend/docs/GUARDRAILS.md 的选项 4）。
# guardrails:
#   enabled: true
#   fail_closed: true
#   provider:
#     use: deerflow.guardrails.typesafe:TypeSafeGuardrailProvider
#     config:
#       model: jev-latest           # 若要求决策在不同版本间可追踪，请固定具体版本（例如 jev-1.13.0）
#       threshold: 0.5              # 示例值；请通过在线评估校准
#       tools: ["bash"]
#       # allowed_tools: ["bash", "read_file", "write_file"]   # 硬性权限列表：
#       #   未列出的工具会在构建任何状态前于本地拒绝；已列出的工具仍须通过风险门控。省略表示不强制限制；
#       #   [] 表示拒绝所有工具。
#       # 可选：api_key / api_key_env（默认 TYPESAFE_API_KEY）/ base_url /
#       #       timeout / deadline_seconds / max_attempts / retry_backoff /
#       #       max_state_chars / cache_size / cache_ttl_seconds /
#       #       instructions / criteria

# ============================================================================
# TypeSafe（Jev）客户端默认值（可选）
# ============================================================================
# 供所有 TypeSafe 使用方共用的配置块：护栏风险门控（guardrails.provider.config），以及启用后的记忆预筛选和
# 信号分类。各使用方可在自己的 `config` 中覆盖所需配置；优先级为：使用方配置 > 此配置块 > 内置默认值。
#
# 以下内容有意不放在此处：失败策略（门控遇错时拒绝，记忆处理路径则继续）、缓存设置、阈值和问题内容。
# 这些属于各使用方自身配置；即使两个使用方的阈值不同，仍可共用一次请求，并各自发布策略标识。
#
# 凭据：优先使用 api_key_env。在此处配置 `api_key` 会将密钥写入此文件。
# 使用方的 `config` 与此配置块是独立层：首先设置 `api_key` 或 `api_key_env` 的层决定使用哪个凭据，
# 因此使用方单独配置的 `api_key_env` 会继续读取该变量。同一层中，明文 `api_key` 优先于该层的 `api_key_env`。
#
# 这些值会在构建使用方时校验，而不是首次调用时校验：`base_url` 不是 http(s) 或带有查询/片段/内嵌凭据，
# 密钥前后有空格（例如从文件挂载的密钥），以及密钥中包含不可打印字符，都会视为配置错误。
# 此处数字会严格校验，因此请写 `max_attempts: 2`；`true` 会被拒绝，而不会被静默读取为 `1`。
#
# typesafe:
#   api_key_env: TYPESAFE_API_KEY        # 默认值；保存密钥的环境变量
#   # api_key: <explicit key>            # api_key_env 的替代项
#   base_url: https://api.typesafe.ai    # 默认值；仅允许 http(s)，不带查询/片段/凭据
#   model: jev-latest                    # 默认值；为便于追踪请固定具体版本
#   timeout: 5.0                         # 单次请求超时时间（秒）
#   deadline_seconds: 10.0               # 整体评估时间预算（秒）
#   max_attempts: 2                      # 包含首次尝试；仅对 429/529 和传输错误重试
#   retry_backoff: 0.5                   # 指数退避的基准秒数

# ============================================================================
# 授权配置
# ============================================================================
# 细粒度资源授权（RBAC 及扩展能力）。默认关闭；所有通过身份验证的用户均可访问所有资源。
# 参见 RFC：https://github.com/bytedance/deer-flow/issues/4063
#
# authorization:
#   enabled: true
#   fail_closed: true            # 服务提供方出错/身份无法解析时拒绝访问
#   default_role: user           # user_role 为 None 时使用；内置 RBAC 要求在下方定义此角色
#   provider:
#     use: deerflow.authz.rbac:RbacAuthorizationProvider
#     config:
#       # 已知角色若未为某资源配置策略，则该角色对该资源不受限制。
#       # 需要限制访问时，请同时定义 `tools` 和 `routes`。
#       # `models` / `skills` 控制按调用方区分的列表/详情接口
#       #（调用方在 GET /api/models 和 GET /api/skills[.../custom, /{name}] 技能路由中可见哪些模型/技能）；
#       # 技能管理接口（安装/编辑/导出）仍受管理员权限控制。
#       #
#       # 插件资源：`plugin_actions` 控制是否可调用已注册的后端操作
#       #（POST /api/plugins/{ns}/actions/{name}）；`plugin_management` 控制是否可访问调用
#       # require_plugin_management 的企业扩展管理路由。目标格式为
#       # "<namespace>/<action-name>" 和 "<namespace>/permissions.read"
#       # / "<namespace>/permissions.write"。**省略某个键表示该角色对相应资源不受限制**，因此需要限制时请显式列出。
#       # 目前声明的插件页面还未纳入门控：其 `plugin_pages` 行会随页面授权切片一并提供。
#       #
#       # 除 admin/user 外的角色名称，需要通过管理员 API 分配给用户后才能生效
#       #（PATCH /api/v1/admin/users/{id}）；仅在此处声明但从未分配的角色不会授予任何权限。
#       roles:
#         admin:
#           tools: {allow: "*"}
#           routes: {allow: "*"}
#           models: {allow: "*"}
#           sandbox: {allow: "*"}
#           skills: {allow: "*"}
#           plugin_actions: {allow: "*"}
#           plugin_management: {allow: "*"}
#         user:
#           tools: {allow: "*", deny: ["update_agent"]}
#           routes: {allow: "*"}
#           models: {allow: "*"}
#           sandbox: {allow: "*"}
#           skills: {allow: "*"}
#           plugin_actions: {allow: "*"}                 # 可调用任意已安装操作
#           plugin_management: {allow: []}               # 无管理路由访问权限
#         guest:
#           # 仅限 Web 的角色：不包含依赖沙箱的工具（read_file、bash、glob、grep、write_file 等）；
#           # sandbox:execute 被拒绝后，这些工具只能返回拒绝错误，因此这里只允许非沙箱工具。
#           tools: {allow: ["web_search"]}
#           routes: {allow: ["threads:read", "runs:read"]}
#           models: {allow: ["gpt-4o-mini"]}
#           sandbox: {allow: false}  # 拒绝沙箱执行
#           skills: {allow: []}      # 列表中不显示任何技能
#           plugin_actions: {allow: ["acme.reports/export"]}
#           plugin_management: {allow: ["acme.reports/permissions.read"]}
authorization:
  enabled: false

# ============================================================================
# 熔断器配置
# ============================================================================
# LLM 调用熔断器可防止反复请求故障的服务提供方。
# 达到失败阈值后，后续调用会快速失败，直到服务恢复。
#
# 适用于以下情况：
# - 避免服务提供方故障期间触发速率限制封禁
# - 减少重试循环造成的资源耗尽
# - LLM 服务不可用时平稳降级

# circuit_breaker:
#   # 熔断前允许的连续失败次数（默认：5）
#   failure_threshold: 5
#   # 尝试恢复前等待的秒数（默认：60）
#   recovery_timeout_sec: 60

# ============================================================================
# LLM 调用并发配置
# ============================================================================
# 限制整个进程中同时进行的 LLM 调用数。服务提供方的突发速率（limit_burst_rate）错误是按请求速率的
# 变化斜率触发的，而非静态配额：因此早高峰（例如 08:30）在几秒内从近乎 0 突增至满负荷时，
# 即使总 RPM 未超限也会被拒绝。限制并发数可以降低该斜率。仅靠重试会使问题恶化（在正在受限的突发期内增加请求）；
# 应配合 LLM 错误处理中间件内置的去相关抖动退避，并最好在入口处配置 nginx `limit_req`。
#
# 0 表示关闭限制（默认值）——现有部署的行为不变。
#
# 此限制按进程而非集群生效：它限制单个 Gateway 进程中正在进行的 LLM 调用数。GATEWAY_WORKERS > 1 时，
# 部署范围内的总上限实际为 `max_concurrent_calls * GATEWAY_WORKERS`；多节点部署还会进一步增加。
# 请据此设置每进程的值（并在入口处配合 nginx `limit_req`，以真正限制整个集群的请求斜率）。
#
# 仅在启动时读取：首次 LLM 运行时捕获此限制，并在进程整个生命周期内保持不变。
# 修改此处的 `max_concurrent_calls` 需重启 Gateway 后才生效；下方其他 `llm_call.*` 参数支持热重载。
# 固定该上限可避免运行时可变的进程级/跨事件循环限流器遇到的缩容和配置新旧竞态
#（例如降低上限后仍可能继续接纳排队等待者，或较旧的配置快照在较新快照之后创建，从而恢复更高的上限）。

# llm_call:
  #   # 整个进程中同时进行的 LLM 调用数上限（默认：0 = 禁用）
#   max_concurrent_calls: 0
  #   # 可重试瞬时错误时的 LLM 调用尝试次数上限；1 = 不重试（默认：3）
#   retry_max_attempts: 3
  #   # 去相关抖动重试退避的基准延迟（毫秒，默认：1000）
#   retry_base_delay_ms: 1000
  #   # 单次重试退避延迟的硬上限（毫秒，默认：8000）
#   retry_cap_delay_ms: 8000
  #   # 仅用于突发速率（limit_burst_rate）429 错误的退避基准（毫秒），高于 retry_base_delay_ms，
  #   # 使唯一一次突发重试在限流窗口结束后发出。服务提供方发送 Retry-After 时忽略此值（默认：5000）
#   burst_retry_base_delay_ms: 5000

# ============================================================================
# SSO / OIDC 身份验证（可选）
# ============================================================================
# 启用通过任意 OIDC 兼容服务提供方（Keycloak、Google、Azure AD、Okta 等）进行 SSO 登录。
# 启用后，登录页会在标准邮箱/密码表单旁显示 SSO 按钮。
#
# 服务提供方配置：
#   - issuer:      OIDC 颁发者 URL（例如 https://keycloak.example.com/realms/deerflow）
#   - client_id:   服务提供方提供的 OAuth2 客户端 ID
#   - client_secret: OAuth2 客户端密钥（支持引用 $ENV_VAR）
#   - redirect_uri: 回调 URL。生产环境必须与服务提供方中的配置一致。
#                   开发环境默认使用自动推导的 URL。
#
# Keycloak 设置：
#   1. 创建客户端，类型选择 "confidential"，并启用 Standard Flow
#   2. 添加有效重定向 URI：http://localhost:8001/api/v1/auth/callback/keycloak
#   3. 添加 Web Origin：http://localhost:8001（或你的前端来源）

# ============================================================================
# 本地（邮箱/密码）身份验证
# ============================================================================
# 默认开放通过 POST /api/v1/auth/register 自助注册：任何能够访问 Gateway 的人都可以创建普通用户账户。
#
# 下方的 OIDC 用户开通策略（allowed_email_domains、require_verified_email、auto_create_users）仅在 SSO 回调中执行。
# 它不会限制本地注册，因此在使用 SSO 开通用户的部署中，如果保持开放，访客仍可创建不受该策略约束的账户。
# 请在此处设置 allow_registration: false。
#
# 无论此设置如何，首个管理员账户始终通过 /initialize 创建，因此关闭注册不会导致全新安装后无法登录。

# auth:
#   local:
#     allow_registration: false
#     # 按客户端 IP 限制登录频率。客户端 IP 使用 AUTH_TRUSTED_PROXIES 中代理提供的 X-Real-IP
#     #（Docker 部署信任其捆绑的 nginx），否则使用 TCP 对端 IP。当许多用户共用一个出口 IP
#     #（公司代理/NAT）时，可调高 max_login_attempts，避免共享 IP 被锁定导致整个办公室无法登录；
#     # 若要采用更严格的策略，可调低此值（最小值为 2——一次失败尝试绝不会锁定 IP，否则一次输入错误
#     # 就会阻断共享出口）。默认值保留历史硬编码策略（5 次失败/5 分钟）。每次登录都会实时读取配置，
#     # 因此无需重启 Gateway，重新加载配置即可生效：降低 lockout_seconds 会提前解除活动锁定，
#     # 收紧 max_login_attempts 会保留已计数的失败次数；调高 lockout_seconds 会延长仍有效的锁定，
#     # 但不会恢复已经过期的锁定。
#     # max_login_attempts: 5
#     # lockout_seconds: 300
#     # 失败登录计数和锁定状态的存储位置（修改后需重启）。
#     #   auto   -- （默认）当 database.backend 为 sqlite 或 postgres 时使用应用数据库，
#     #             使所有共享该数据库的 Gateway 副本对每个 IP 执行统一锁定；
#     #             database.backend: memory 时回退到进程内计数器。
#     #   memory -- 仅使用进程内计数器。N 个副本会给攻击者 N × max_login_attempts 次猜测机会，
#     #             且一个副本上的锁定对其他副本不可见（多实例部署启动时会记录 WARNING）。
#     #   db     -- 使用共享的 login_throttle 表；database.backend 为 memory 时会警告并回退到内存，
#     #             配置的数据库引擎不可用时则拒绝启动。
#     # throttle_storage: auto
#
#   oidc:
#     enabled: true
#     # 前端基础 URL，用于 SSO 回调后的重定向。
#     # 生产环境使用反向代理时，请将其设为公开前端 URL（例如 https://deerflow.example.com）。开发环境保持未设置。
#     # frontend_base_url: http://localhost:3000
#     providers:
#       keycloak:
#         display_name: Keycloak
#         issuer: https://keycloak.example.com/realms/deerflow
#         client_id: deerflow
#         client_secret: $KEYCLOAK_CLIENT_SECRET
#         # 可选：显式设置回调 URL。
#         # redirect_uri: https://deerflow.example.com/api/v1/auth/callback/keycloak
#         scopes:
#           - openid
#           - email
#           - profile
#         token_endpoint_auth_method: client_secret_post
#
#         # 用户开通设置（下方显示安全默认值）：
#         auto_create_users: true          # 首次 SSO 登录时自动创建 DeerFlow 账户
#         require_verified_email: true     # 拒绝邮箱未验证的 SSO 登录
#         # allowed_email_domains:          # 限制为指定邮箱域名
#         #   - example.com
#         admin_emails: []                 # 自动向这些邮箱授予管理员角色
#
#         # 安全功能（默认启用）：
#         pkce_enabled: true               # 授权码流程使用 PKCE（S256）
#         nonce_enabled: true              # 校验 ID Token 中的 Nonce

# --- 插件 ----------------------------------------------------------------
# 扩展包会在启动时按此处顺序加载一次。每个条目以 "module.path:install" 的形式指定安装入口点；
# `config` 配置块会原样传递给该扩展包，并由扩展包自行校验。
#
# 建议使用扩展管理器，而不是手动编辑此列表：
#   make extension-install SOURCE="deerflow-extension-acme==1.2.3"
#   make extension-install SOURCE="git+https://github.com/acme/deerflow-extension-acme.git@<commit>"
#   make extension-install SOURCE="/absolute/path/to/local-extension"
#   make extension-list
#   make extension-enable NAME=acme
#   make extension-disable NAME=acme
#   make extension-remove NAME=acme
# 安装器会同步更新 backend/pyproject.toml、backend/uv.lock 和此配置块。它还会要求运维人员确认来源可信；
# 扩展及其构建系统会以 Gateway 权限执行。
#
# 每次安装、启用、禁用、移除或手动编辑都需要重启 Gateway。开发启动器可能会在移交前获取缺失的锁定制品；
# 已构建的生产 Gateway 启动时绝不会安装插件。本地目录会复制到 backend/extensions/sources，
# 作为可部署快照；为确保远程来源可复现，请固定版本或公开 HTTPS Git 提交。标准 Docker 构建器不会转发宿主机 SSH 凭据，
# 因此会拒绝 SSH Git URL。插件加载仍需显式配置：在管理器之外安装的包，除非列入此处，否则不会生效；列表顺序决定贡献顺序。
#
# 此处有意与上方的 `extensions:` 配置块（MCP 服务器、技能、配置声明的中间件）分开。
# 上方配置块由 extensions_config.json 提供支持，Gateway 可通过 HTTP 端点重写该文件；
# 会导致导入代码的列表必须只保留在此运维人员控制的文件中。
#
# 插件可提供按语义定位的中间件、任务生命周期钩子、系统模型观察器、Gateway 生命周期服务以及即时加载的 FastAPI HTTP 路由。
# 参见 examples/deerflow-extension-example，其中的扩展包演示了以上全部五种能力。
#
# plugins:
#   - name: example                       # PEP 621 入口点名称
#     package: deerflow-extension-example # 由 uv 管理的 Python 发行包
#     use: deerflow_extension_example:install
#     enabled: true                       # false 表示跳过导入和注册
#     required: false                     # true 表示加载失败时终止 Gateway 启动
#                                         #（install --required 会启用此项）
#     host_access:                        # 可选的宿主授权（修改后需要重启）
#       model_invocation:
#         roles:                          # 逻辑角色 -> 已配置的 models[].name
#           default: my-configured-model
#         max_concurrency: 2              # 此安装的所有服务共用
#         timeout_seconds: 60             # 包含等待可用容量的时间
#         max_input_chars: 262144         # 包含响应架构说明
#         max_output_chars: 65536         # 返回文本的上限，生成后校验
#     table_prefix: example_ext_          # 可选：此扩展在自身 MetaData/迁移链下拥有的表名前缀。
#                                         # 防止直接对运行中的数据库执行 `alembic revision --autogenerate` 时看到
#                                         # 这些表并建议删除它们。（`make migrate-rev` 会基于迁移链构建临时 SQLite
#                                         # 并进行差异比较，因此本来就看不到这些表。）
#                                         # 若为空或也匹配宿主拥有的表名，启动时会拒绝。
#     config:
#       label: example                    # 扩展专属配置值（如有）
