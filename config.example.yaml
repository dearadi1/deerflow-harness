# ============================================================================
# 知识能力
# ============================================================================
# 可选的知识能力，默认关闭。服务提供方连接和检索设置应配置在下方 `tools:` 中对应的条目
# （例如 RAGFlow 的 `knowledge_search` 工具），而非此处。
knowledge_base:
  enabled: false
  # 仅用于自定义 Agent 对话。只有实际生效的 knowledge_search 服务提供方是内置 RAGFlow 工具时，
  # 才显示选择器。
  scope_selection_enabled: false

# ============================================================================
# 工具组配置
# ============================================================================
# 定义工具组以便组织管理并控制访问权限

tool_groups:
  - name: web
  - name: file:read
  - name: file:write
  - name: bash
  - name: browser
  - name: knowledge

# ============================================================================
# 工具配置
# ============================================================================
# 配置 Agent 可用的工具

tools:
  # 读取显式引用的对话（仅限 Gateway API，需主动启用）。
  # 每次运行都必须提交 conversation_references；参见 backend/docs/API.md。
  # - name: read_conversation
  #   group: conversation
  #   use: deerflow.tools.conversation:read_conversation

  # RAGFlow 知识检索（只读）。取消注释此单个条目即可启用。
  # `datasets` 为可选项。省略时，搜索会列出当前租户可见的所有数据集；显式设置 `datasets: []` 无效。
  # 空数据集会被跳过；可搜索数据集按嵌入模型分组，最多并行检索四组。
  # 各组结果会在全局 `page_size` 限额内交错排列；搜索多个分组时不显示分数，因为分数不可直接比较。
  # 仅在需要限制范围时配置稳定 ID。ID 和目录列表不会传给模型。
  # - name: knowledge_search
  #   group: knowledge
  #   use: deerflow.community.ragflow.tools:knowledge_search_tool
  #   base_url: http://localhost:9380  # Docker 环境中请使用后端可访问的 URL
  #   api_key: $RAGFLOW_API_KEY
  #   datasets:  # 可选的运维人员控制的允许列表
  #     - 0123456789abcdef0123456789abcdef  # 替换为 RAGFlow 数据集 ID
  #   timeout: 30
  #   page_size: 8
  #   similarity_threshold: 0.2
  #   vector_similarity_weight: 0.3
  #   top_k: 256
  #   max_chars_per_chunk: 800
  #   max_total_chars: 8000
  # - name: list_knowledge_bases
  #   group: knowledge
  #   use: deerflow.community.ragflow.tools:list_knowledge_bases_tool

  # LightRAG 知识检索（只读）。这是同一 knowledge_search 工具的另一种服务提供方；请取消注释此项，
  # 而不是 RAGFlow 条目。重名时只会保留首个条目，因此只能配置其中一种。需要 LightRAG v1.4.9+
  # （响应封装和引用字段）。通过数据检索端点搜索部署中的单个已索引工作区
  # （LightRAG 内部不执行 LLM 生成）。`api_key` 为可选项；仅在回环或可信网络服务器上省略，
  # 启用身份验证时密钥会通过 X-API-Key 请求头发送。`mode` 选择检索策略：naive、local、
  # global、hybrid 或 mix（默认 mix，与 LightRAG 自身默认值一致）。
  # 内部片段和引用标识符不会传给模型。
  # - name: knowledge_search
  #   group: knowledge
  #   use: deerflow.community.lightrag.tools:knowledge_search_tool
  #   base_url: http://localhost:9621  # Docker 环境中请使用后端可访问的 URL
  #   api_key: $LIGHTRAG_API_KEY  # 仅对可信且未启用身份验证的服务器省略
  #   mode: mix
  #   timeout: 30
  #   top_k: 60
  #   chunk_top_k: 8  # 可选；省略时使用服务器默认值
