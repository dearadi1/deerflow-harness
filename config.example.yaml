  #   #                                    # 两项都接受 YAML 列表或
  #   #                                    # 逗号分隔的字符串。正则表达式包含
  #   #                                    # 逗号时必须使用 YAML 列表形式。

  # 网页抓取工具（使用 Crawl4AI - 自托管无头 Chromium，无需第三方 API 密钥）
