[project]
name = "deerflow-harness"
version = "2.1.0"
description = "DeerFlow agent harness framework"
requires-python = ">=3.12"
dependencies = [
    "agent-client-protocol>=0.4.0",
    "agent-sandbox>=0.0.30",
    "beautifulsoup4>=4.12",
    "html5lib>=1.1",
    "croniter>=6.0.0",
    # 有意精确锁定（扩展系统版本契约）：宿主锁定其实现的契约版本，扩展声明版本范围。
    # 若此处使用范围，pip 可能解析出高于本 Harness 实际实现版本的契约包，
    # 导致较新的扩展在运行时看似受支持。
    "deerflow-extension-api==0.2.9",
    "dotenv>=0.9.9",
    "exa-py>=1.0.0",
    "httpx>=0.28.0",
    "jsonschema>=4.26.0",
    "kubernetes>=30.0.0",
    # 最低版本与锁文件解析结果及测试所用版本一致
    #（langgraph 1.2.9 会通过传递依赖引入 langchain >=1.3）。
    "langchain>=1.3",
    "langchain-anthropic>=1.4.1",
    "langchain-deepseek>=1.0.1",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-openviking==0.1.0",
    "langchain-openai>=1.2.1",
    "langfuse>=3.4.1",
    "langgraph>=1.2.9,<1.3",
    "langgraph-api>=0.8.1",
    "langgraph-cli>=0.4.24",
    # 独立 Studio 的运行时启动前持久化修复已基于 0.30.0 的存储生命周期验证，
    # 不应解析到更早的实现版本。
    "langgraph-runtime-inmem>=0.30.0",
    "markdownify>=1.2.2",
    "markitdown[all,xlsx]>=0.0.1a2",
    "packaging>=24.2",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "readabilipy>=0.3.0",
    "regex>=2026.4.4",
    "tavily-python>=0.7.17",
    "firecrawl-py>=1.15.0",
    "tiktoken>=0.8.0",
    "ddgs>=9.10.0",
    "duckdb>=1.4.4",
    "langchain-google-genai>=4.2.1",
    # 最低版本很重要：上游在 4.2.0 修复迁移后首次写入丢失的问题（#8526）后，
    # 移除了 InMemorySaver 的增量历史补丁并保留了自身的版本覆盖；
    # 因此解析到 4.1.x 会悄然重新引入该问题。langgraph 自身的约束
    #（langgraph-checkpoint>=4.1.0）并未排除该版本。
    "langgraph-checkpoint>=4.2.0,<5.0",
    "langgraph-checkpoint-sqlite>=3.1.1,<3.2",
    "langgraph-sdk>=0.1.51",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.19",
    "alembic>=1.13",
    "cryptography>=50.0.0",
    "e2b-code-interpreter>=2.8.0",
    # zoneinfo 备用数据源：ZoneInfo 优先读取操作系统时区数据库；当镜像中没有该数据库时
    #（精简容器或未安装 tzdata 的 Windows），则使用此 wheel，
    # 从而让 DEER_FLOW_DATE_TIMEZONE 配置项可移植。
    "tzdata>=2025.1",
]

[project.scripts]
deerflow = "deerflow.tui.cli:main"

[project.optional-dependencies]
# 终端工作台（TUI）。设为可选依赖以保持核心 Harness 安装精简；
# 缺少 textual 时，`deerflow` 控制台脚本会退化为无界面帮助模式。
tui = ["textual>=0.80"]
# GroundRoute 无需额外软件包（httpx 已是核心依赖）。保留此空 extra，
# 使文档中的 `uv add 'deerflow-harness[groundroute]'` 安装命令可以正常解析，
# 不会出现“未知 extra”警告。
groundroute = []
ollama = ["langchain-ollama>=0.3.0"]
postgres = [
    "asyncpg>=0.29",
    # 3.1.2 可以找到普通值的增量种子（上游 #8535）；3.1.1 则会跳过它们，
    # 转而访问线程根节点。
    "langgraph-checkpoint-postgres>=3.1.2,<3.2",
    "psycopg[binary]>=3.3.3",
    "psycopg-pool>=3.3.0",
]
# 跨进程 SSE 流桥接器（stream_bridge.type: redis）。设为可选依赖，
# 单进程或内存桥接器安装时无需引入 redis。Docker 镜像始终安装此 extra，
# 因为 Docker 默认使用 redis 桥接器。
redis = ["redis>=5.0.0"]
pymupdf = ["pymupdf4llm>=0.0.17"]
boxlite = ["boxlite>=0.9.7"]
# Tenki 云沙箱提供方（deerflow.community.tenki）。设为可选依赖，使默认安装
# 不包含 Tenki SDK；仅在使用该提供方时引入。发行包名为 ``tenki``，其中仍包含
# provider.py 和 sandbox.py 导入的 ``tenki_sandbox`` 模块。
tenki = ["tenki>=1.4.0"]
# OpenSandbox 远程沙箱提供方（deerflow.community.opensandbox）。
# 仅在选择该提供方时加载同步 SDK。
opensandbox = ["opensandbox>=0.1.15,<0.2.0"]
# Agent 可观测性（Monocle）。设为可选依赖，使默认安装不包含 OpenTelemetry 组件；
# 仅在启用 MONOCLE_TRACING 时引入。
monocle = ["monocle_apptrace>=0.8.8"]
# Agent 浏览器控制（browser_navigate/click/type/... 工具组）。设为可选依赖以保持
# 核心 Harness 安装精简；在私有 Playwright 循环中延迟导入。安装后需运行一次
# `playwright install chromium`。
browser = ["playwright>=1.40"]
# 为 FTS5 记忆检索适配器提供可选的中文分词支持。
memory-zh = ["jieba>=0.42.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deerflow"]

[tool.uv.sources]
deerflow-extension-api = { path = "extension-api" }
